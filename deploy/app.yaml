# Deploy from the bastion with:  deploy-app app.yaml
# Environment variables (${ALB_SG_ID}, ${ALB_NAME}, ${APP_PORT}, ${HEALTH_CHECK_PATH},
# ${AWS_REGION}, ${S3_BUCKET_NAME}, ${RDS_HOST}, ${RDS_DB}, ${RDS_USER}, ${RDS_PASSWORD})
# are loaded from /etc/eks-env (written by Terraform when it creates the bastion).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: default
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: "${IMAGE_URI}"
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: AWS__Region
              value: "${AWS_REGION}"
            - name: S3__BucketName
              value: "${S3_BUCKET_NAME}"
            - name: S3__KeyPrefix
              value: "training-uploads"
            - name: ConnectionStrings__Rds
              value: "Host=${RDS_HOST};Port=5432;Database=${RDS_DB};Username=${RDS_USER};Password=${RDS_PASSWORD};SSL Mode=Require;Trust Server Certificate=true"
            - name: ASPNETCORE_URLS
              value: "http://+:80"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: app
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: ${ALB_NAME}
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/security-groups: ${ALB_SG_ID}
    alb.ingress.kubernetes.io/healthcheck-path: ${HEALTH_CHECK_PATH}
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
