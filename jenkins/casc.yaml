jenkins:
  systemMessage: "EKS Jenkins CI/CD"

jobs:
  - script: >
      pipelineJob('dotnet-eks-cicd') {
        description('Builds the .NET image, pushes it to ECR, and deploys it to EKS')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/5monthsdevopstraining/5monthsdevopstraining.git')
                }
                branch('*/manoj-eks-jenkins')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
