apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dotnet-app
  template:
    metadata:
      labels:
        app: dotnet-app
    spec:
      serviceAccountName: dotnet-app
      containers:
        - name: dotnet-app
          image: REPLACE_WITH_ECR_REPOSITORY_URL:v1
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_URLS
              value: http://+:8080
            - name: AWS__Region
              value: ap-south-1
            - name: S3__BucketName
              value: dotnet-app-dev-artifacts
            - name: S3__KeyPrefix
              value: training-uploads
            - name: ConnectionStrings__Rds
              valueFrom:
                secretKeyRef:
                  name: dotnet-app-db
                  key: connection-string
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
