apiVersion: apps/v1
kind: Deployment
metadata:
  name: dotnet-api
  namespace: sample-app
  labels:
    app.kubernetes.io/name: dotnet-api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dotnet-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # start one extra pod during an update...
      maxUnavailable: 0    # ...and never remove a ready pod before its replacement is ready
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dotnet-api
    spec:
      serviceAccountName: dotnet-api      # linked to the IAM role by EKS Pod Identity
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654                   # the "app" user in the official .NET images
        runAsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: dotnet-api
      containers:
        - name: api
          image: ${IMAGE_URI}             # set by Jenkins: <ecr-repo-url>:<build>-<git-sha>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: dotnet-api-config
            - secretRef:
                name: dotnet-api-connection
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /swagger/v1/swagger.json
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp             # ASP.NET buffers uploaded files here
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
