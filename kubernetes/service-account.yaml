apiVersion: v1
kind: ServiceAccount
metadata:
  name: dotnet-api            # must match var.k8s_service_account in Terraform
  namespace: sample-app
  labels:
    app.kubernetes.io/name: dotnet-api
# No role annotation is needed: the link to the IAM role is the EKS Pod Identity
# association created by Terraform (aws_eks_pod_identity_association.app).
